import groovy.xml.XmlSlurper

plugins {
    id 'base'
    id 'org.jetbrains.kotlin.jvm' apply false
}

def expectedProjectDirectories = [
    ':emotify-core': 'modules/emotify-core',
    ':emotify-wire-v1': 'modules/emotify-wire-v1',
    ':emotify-server-core': 'modules/emotify-server-core',
    ':emotify-catalog-builtin': 'modules/emotify-catalog-builtin',
    ':minecraft-client-1.21.1': 'modules/minecraft-client-1.21.1',
    ':neoforge-1.21.1': 'platforms/neoforge-1.21.1',
    ':fabric-1.21.1': 'platforms/fabric-1.21.1',
    ':paper-1.21': 'platforms/paper-1.21'
]
def expectedProjectPaths = expectedProjectDirectories.keySet().toList().sort()
def configuredProjectPaths = subprojects.collect { subproject -> subproject.path }.sort()
def configuredProjectDirectories = expectedProjectDirectories.collectEntries { projectPath, relativePath ->
    [(projectPath): project(projectPath).projectDir.canonicalPath]
}
def requiredProjectDirectories = expectedProjectDirectories.collectEntries { projectPath, relativePath ->
    [(projectPath): rootProject.file(relativePath).canonicalPath]
}
def configuredRootName = rootProject.name
def unexpectedRootSourceDirectory = rootProject.file('src')
def neoForgeSourceDirectory = project(':neoforge-1.21.1').file('src/main/kotlin')
def fabricSourceDirectory = project(':fabric-1.21.1').file('src/main/kotlin')
def fabricClientSourceDirectory = project(':fabric-1.21.1').file('src/client/kotlin')
def minecraftClientSourceDirectory = project(':minecraft-client-1.21.1').file('src/main/kotlin')
def minecraftClientAdapterSourceDirectory = project(':minecraft-client-1.21.1').file('src/minecraft/kotlin')
def paperSourceDirectory = project(':paper-1.21').file('src/main/kotlin')
def testReportDirectories = expectedProjectPaths.collectEntries { projectPath ->
    [(projectPath): project(projectPath).layout.buildDirectory.dir('test-results/test')]
}
def githubActions = providers.environmentVariable('GITHUB_ACTIONS').orElse('')
def githubRefType = providers.environmentVariable('GITHUB_REF_TYPE').orElse('')
def githubRefName = providers.environmentVariable('GITHUB_REF_NAME').orElse('')
def configuredModVersion = providers.gradleProperty('mod_version')

def verifyReleaseIdentity = tasks.register('verifyReleaseIdentity') {
    group = 'verification'
    description = 'Verifies that a GitHub release tag exactly matches a non-snapshot project version.'
    inputs.property('githubActions', githubActions)
    inputs.property('githubRefType', githubRefType)
    inputs.property('githubRefName', githubRefName)
    inputs.property('modVersion', configuredModVersion)
    onlyIf {
        githubActions.get() == 'true' && githubRefType.get() == 'tag'
    }

    doLast {
        def releaseVersion = configuredModVersion.get()
        if (releaseVersion.toUpperCase(Locale.ROOT).contains('SNAPSHOT')) {
            throw new GradleException("GitHub release tags cannot publish a snapshot version: ${releaseVersion}")
        }
        def expectedTag = "v${releaseVersion}".toString()
        if (githubRefName.get() != expectedTag) {
            throw new GradleException(
                "GitHub release tag ${githubRefName.get()} does not match project version ${expectedTag}"
            )
        }
    }
}

def verifyProjectStructure = tasks.register('verifyProjectStructure') {
    group = 'verification'
    description = 'Verifies the neutral root, shared modules and platform boundaries.'

    doLast {
        if (configuredRootName != 'Emotify') {
            throw new GradleException("Unexpected root project name: ${configuredRootName}")
        }
        if (configuredProjectPaths != expectedProjectPaths) {
            throw new GradleException(
                "Unexpected project paths: ${configuredProjectPaths.join(', ')}"
            )
        }
        def misplacedProjects = expectedProjectPaths.findAll { projectPath ->
            configuredProjectDirectories[projectPath] != requiredProjectDirectories[projectPath]
        }
        if (!misplacedProjects.isEmpty()) {
            throw new GradleException(
                "Projects use unexpected directories: ${misplacedProjects.join(', ')}"
            )
        }
        if (unexpectedRootSourceDirectory.exists()) {
            throw new GradleException('Neutral root must not contain a source tree')
        }
        if (!neoForgeSourceDirectory.isDirectory()) {
            throw new GradleException('NeoForge platform source tree is missing')
        }
        if (!fabricSourceDirectory.isDirectory()) {
            throw new GradleException('Fabric common source tree is missing')
        }
        if (!fabricClientSourceDirectory.isDirectory()) {
            throw new GradleException('Fabric client source tree is missing')
        }
        if (!minecraftClientSourceDirectory.isDirectory()) {
            throw new GradleException('Shared Minecraft client source tree is missing')
        }
        if (!minecraftClientAdapterSourceDirectory.isDirectory()) {
            throw new GradleException('Shared Minecraft client adapter source tree is missing')
        }
        if (!paperSourceDirectory.isDirectory()) {
            throw new GradleException('Paper platform source tree is missing')
        }
    }
}

def verifyTestReports = tasks.register('verifyTestReports') {
    group = 'verification'
    description = 'Verifies that every module test report exists and has no failures, errors or skipped tests.'
    dependsOn expectedProjectPaths.collect { projectPath -> "${projectPath}:test" }
    inputs.files(testReportDirectories.values())

    doLast {
        def results = testReportDirectories.collectEntries { projectPath, reportDirectoryProvider ->
            def reportDirectory = reportDirectoryProvider.get().asFile
            def reportFiles = reportDirectory.isDirectory() ?
                reportDirectory.listFiles().findAll { reportFile ->
                    reportFile.isFile() && reportFile.name.startsWith('TEST-') && reportFile.name.endsWith('.xml')
                } : []
            if (reportFiles.isEmpty()) {
                throw new GradleException("No test reports found for ${projectPath}")
            }
            def totals = [tests: 0, failures: 0, errors: 0, skipped: 0]
            reportFiles.each { reportFile ->
                def suite = new XmlSlurper(false, false).parse(reportFile)
                totals.keySet().each { metric ->
                    def value = suite.attributes()[metric]?.toString()
                    totals[metric] += value ? value.toInteger() : 0
                }
            }
            [(projectPath): totals]
        }
        def violations = results.findAll { projectPath, totals ->
            totals.failures != 0 || totals.errors != 0 || totals.skipped != 0
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Test report violations: ${violations}")
        }
        def totalTests = results.values().sum { totals -> totals.tests }
        logger.lifecycle("Verified ${totalTests} tests across ${results.size()} modules: ${results}")
    }
}

tasks.register('verifyReleaseJar') {
    group = 'verification'
    description = 'Verifies every current platform release artifact.'
    dependsOn verifyReleaseIdentity
    dependsOn ':neoforge-1.21.1:verifyReleaseJar'
    dependsOn ':fabric-1.21.1:verifyFabricReleaseJar'
    dependsOn ':paper-1.21:verifyPaperReleaseJar'
}

tasks.register('verifyDevRuntimeClasspath') {
    group = 'verification'
    description = 'Verifies every current loader development runtime.'
    dependsOn ':neoforge-1.21.1:verifyDevRuntimeClasspath'
    dependsOn ':fabric-1.21.1:verifyFabricDevRuntimeClasspath'
}

tasks.named('clean') {
    dependsOn expectedProjectPaths.collect { projectPath -> "${projectPath}:clean" }
}

tasks.named('assemble') {
    dependsOn expectedProjectPaths.collect { projectPath -> "${projectPath}:assemble" }
}

tasks.named('check') {
    dependsOn verifyReleaseIdentity
    dependsOn verifyProjectStructure
    dependsOn verifyTestReports
    dependsOn expectedProjectPaths.collect { projectPath -> "${projectPath}:check" }
}
