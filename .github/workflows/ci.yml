name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Run verification on Linux
        if: runner.os == 'Linux'
        run: bash ./gradlew check --console=plain

      - name: Run verification on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat check --console=plain

      - name: Verify configuration cache reuse on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          output="$(bash ./gradlew check --console=plain)"
          printf '%s\n' "$output"
          if ! grep -Fq 'Reusing configuration cache.' <<< "$output"; then
            output="$(bash ./gradlew check --console=plain)"
            printf '%s\n' "$output"
          fi
          if ! grep -Fq 'Reusing configuration cache.' <<< "$output"; then
            echo 'Gradle did not reuse the configuration cache.' >&2
            exit 1
          fi

      - name: Verify configuration cache reuse on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = .\gradlew.bat check --console=plain | Out-String
          $exitCode = $LASTEXITCODE
          Write-Output $output
          if ($exitCode -ne 0) {
            throw "Gradle verification failed with exit code $exitCode."
          }
          if ($output -notmatch 'Reusing configuration cache\.') {
            $output = .\gradlew.bat check --console=plain | Out-String
            $exitCode = $LASTEXITCODE
            Write-Output $output
            if ($exitCode -ne 0) {
              throw "Gradle verification failed with exit code $exitCode."
            }
          }
          if ($output -notmatch 'Reusing configuration cache\.') {
            throw 'Gradle did not reuse the configuration cache.'
          }

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: emotify-test-reports-${{ matrix.name }}-${{ github.sha }}
          path: |
            modules/*/build/reports/tests/test/
            modules/*/build/test-results/test/
            platforms/*/build/reports/tests/test/
            platforms/*/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop Gradle daemon on Windows
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat --stop

  release-artifact:
    name: Package verified platform JARs
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Build verified platform JARs
        run: bash ./gradlew check --console=plain

      - name: Check out independent reproducibility copy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: reproducibility-copy

      - name: Verify reproducible artifacts
        shell: bash
        run: |
          shopt -s nullglob
          platform_tasks=(
            :neoforge-1.21.1:jar :neoforge-1.21.1:verifyReleaseJar
            :fabric-1.21.1:remapJar :fabric-1.21.1:verifyFabricReleaseJar
            :neoforge-1.21.8:jar :neoforge-1.21.8:verifyReleaseJar
            :fabric-1.21.8:remapJar :fabric-1.21.8:verifyFabricReleaseJar
            :neoforge-1.21.11:jar :neoforge-1.21.11:verifyReleaseJar
            :fabric-1.21.11:remapJar :fabric-1.21.11:verifyFabricReleaseJar
            :paper-1.21:jar :paper-1.21:verifyPaperReleaseJar
          )
          bash ./reproducibility-copy/gradlew -p ./reproducibility-copy "${platform_tasks[@]}" --console=plain --no-build-cache
          mkdir -p build/release/neoforge build/release/fabric build/release/paper
          release_specs=(
            'neoforge|platforms/neoforge-1.21.1/build/libs/emotify-neoforge-1.21.1-*.jar'
            'fabric|platforms/fabric-1.21.1/build/libs/emotify-fabric-1.21.1-*.jar'
            'neoforge|platforms/neoforge-1.21.8/build/libs/emotify-neoforge-1.21.8-*.jar'
            'fabric|platforms/fabric-1.21.8/build/libs/emotify-fabric-1.21.8-*.jar'
            'neoforge|platforms/neoforge-1.21.11/build/libs/emotify-neoforge-1.21.11-*.jar'
            'fabric|platforms/fabric-1.21.11/build/libs/emotify-fabric-1.21.11-*.jar'
            'paper|platforms/paper-1.21/build/libs/emotify-paper-*.jar'
          )
          for specification in "${release_specs[@]}"; do
            destination="${specification%%|*}"
            pattern="${specification#*|}"
            original=( $pattern )
            rebuilt=( reproducibility-copy/$pattern )
            if (( ${#original[@]} != 1 || ${#rebuilt[@]} != 1 )); then
              echo "Expected one original and one rebuilt artifact for $pattern."
              exit 1
            fi
            if ! cmp --silent "${original[0]}" "${rebuilt[0]}"; then
              echo "Artifact is not reproducible: $pattern"
              exit 1
            fi
            hash="$(sha256sum "${rebuilt[0]}" | cut -d ' ' -f 1)"
            echo "Verified reproducible artifact: ${rebuilt[0]} $hash"
            cp "${rebuilt[0]}" "build/release/$destination/"
          done

      - name: Upload NeoForge release JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: emotify-neoforge-${{ github.sha }}
          path: build/release/neoforge/*.jar
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload Paper and Purpur release JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: emotify-paper-1.21-${{ github.sha }}
          path: build/release/paper/*.jar
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload Fabric release JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: emotify-fabric-${{ github.sha }}
          path: build/release/fabric/*.jar
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
