def verifyDevRuntimeClasspath = tasks.register('verifyDevRuntimeClasspath') {
    group = 'verification'
    description = 'Verifies the resolved NeoForge launch runtime and merged project boundaries.'
    inputs.files(neoForgeLaunchRuntime, embeddedProjectRuntime)

    doLast {
        def runtimeFiles = neoForgeLaunchRuntime.get().files.findAll { runtimeFile -> runtimeFile.isFile() }
        def requireRuntimeArtifact = { specification ->
            def expectedName = "${specification.name}-${specification.version}.jar".toString()
            def matches = runtimeFiles.findAll { runtimeFile ->
                runtimeFile.name == expectedName
            }
            if (matches.size() != 1) {
                throw new GradleException(
                    "NeoForge launch runtime requires exactly one ${expectedName}; resolved=" +
                        runtimeFiles.collect { runtimeFile -> runtimeFile.name }.join(', ')
                )
            }
            def runtimeArtifact = matches.first()
            new ZipFile(runtimeArtifact).withCloseable { archive ->
                def missingEntries = specification.requiredEntries.findAll { entry ->
                    archive.getEntry(entry) == null
                }
                if (!missingEntries.isEmpty()) {
                    throw new GradleException(
                        "NeoForge launch runtime artifact ${runtimeArtifact.name} is incomplete: " +
                            missingEntries.join(', ')
                    )
                }
            }
            runtimeArtifact
        }

        def kotlinArtifacts = runtimeFiles.findAll { runtimeFile ->
            runtimeFile.name ==~ /kotlin-(?:stdlib(?:-jdk[78])?|reflect)-[0-9].*\.jar/
        }
        def invalidKotlinArtifacts = kotlinArtifacts.findAll { runtimeFile ->
            !runtimeFile.name.endsWith("-${targetKotlinRuntimeVersion}.jar".toString())
        }
        def duplicateKotlinModules = kotlinArtifacts.groupBy { runtimeFile ->
            runtimeFile.name.replaceFirst(/-[0-9].*\.jar$/, '')
        }.findAll { name, artifacts -> artifacts.size() != 1 }
        if (!invalidKotlinArtifacts.isEmpty() || !duplicateKotlinModules.isEmpty()) {
            throw new GradleException(
                "NeoForge launch runtime has inconsistent Kotlin modules: invalid=" +
                    invalidKotlinArtifacts.collect { runtimeFile -> runtimeFile.name }.join(', ') +
                    ", duplicates=${duplicateKotlinModules.keySet().join(', ')}"
            )
        }

        requireRuntimeArtifact([
            group: 'org.jetbrains.kotlin',
            name: 'kotlin-stdlib',
            version: targetKotlinRuntimeVersion,
            requiredEntries: ['kotlin/Unit.class', 'kotlin/collections/CollectionsKt.class']
        ])

        def kotlinForForgeSpecifications = [
            [
                group: 'thedarkcolour',
                name: 'kotlinforforge-neoforge',
                version: targetKotlinForForgeVersion,
                requiredEntries: [
                    'META-INF/jarjar/metadata.json',
                    "META-INF/jarjar/kotlin-stdlib-${targetKotlinRuntimeVersion}.jar".toString()
                ]
            ],
            [
                group: 'thedarkcolour',
                name: 'kfflang-neoforge',
                version: targetKotlinForForgeVersion,
                requiredEntries: [
                    'thedarkcolour/kotlinforforge/neoforge/KotlinLanguageLoader.class',
                    'META-INF/services/net.neoforged.neoforgespi.language.IModLanguageLoader'
                ]
            ],
            [
                group: 'thedarkcolour',
                name: 'kfflib-neoforge',
                version: targetKotlinForForgeVersion,
                requiredEntries: ['thedarkcolour/kotlinforforge/neoforge/kotlin/KotlinKt.class']
            ],
            [
                group: 'thedarkcolour',
                name: 'kffmod-neoforge',
                version: targetKotlinForForgeVersion,
                requiredEntries: ['META-INF/neoforge.mods.toml']
            ]
        ]
        kotlinForForgeSpecifications.each(requireRuntimeArtifact)
        def resolvedKotlinForForgeArtifacts = runtimeFiles.findAll { runtimeFile ->
            runtimeFile.name ==~ /(?:kotlinforforge|kfflang|kfflib|kffmod)-neoforge-[0-9].*\.jar/
        }
        def expectedKotlinForForgeNames = kotlinForForgeSpecifications.collect { specification ->
            specification.name
        }.toSet()
        def unexpectedKotlinForForgeArtifacts = resolvedKotlinForForgeArtifacts.findAll { runtimeFile ->
            !expectedKotlinForForgeNames.any { expectedName ->
                runtimeFile.name == "${expectedName}-${targetKotlinForForgeVersion}.jar".toString()
            }
        }
        if (!unexpectedKotlinForForgeArtifacts.isEmpty()) {
            throw new GradleException(
                "NeoForge launch runtime contains unexpected Kotlin for Forge artifacts: " +
                    unexpectedKotlinForForgeArtifacts.collect { runtimeFile -> runtimeFile.name }.join(', ')
            )
        }

        requireRuntimeArtifact([
            group: 'com.google.code.gson',
            name: 'gson',
            version: targetGsonRuntimeVersion,
            requiredEntries: [
                'com/google/gson/GsonBuilder.class',
                'com/google/gson/stream/JsonReader.class'
            ]
        ])
        requireRuntimeArtifact([
            group: 'it.unimi.dsi',
            name: 'fastutil',
            version: targetFastutilRuntimeVersion,
            requiredEntries: [
                'it/unimi/dsi/fastutil/objects/Object2ObjectOpenHashMap.class',
                'it/unimi/dsi/fastutil/ints/Int2ObjectOpenHashMap.class'
            ]
        ])

        def filenameFallbackArtifacts = neoForgeLaunchRuntime.get().files.findAll { runtimeFile ->
            runtimeFile.name in embeddedProjectJarNames
        }
        def duplicateProjectModuleArtifacts = (
            embeddedProjectRuntime.files + filenameFallbackArtifacts
        ).unique()
        if (!duplicateProjectModuleArtifacts.isEmpty()) {
            throw new GradleException(
                "NeoForge launch runtime duplicates merged local mod source sets: " +
                    duplicateProjectModuleArtifacts.collect { runtimeFile -> runtimeFile.name }.join(', ')
            )
        }
    }
}

def verifyReleaseJar = tasks.register('verifyReleaseJar') {
    group = 'verification'
    description = 'Verifies the Emotify release JAR contents and metadata.'
    dependsOn tasks.named('jar')
    dependsOn ':minecraft-client-1.21.11:verifyLoaderNeutralClientBoundary'
    dependsOn ':minecraft-client-1.21.11:verifyClientLibraryJar'
    inputs.file(releaseJar)

    doLast {
        def archiveFile = releaseJar.get().asFile
        def requiredEntries = [
            'META-INF/MANIFEST.MF',
            'META-INF/neoforge.mods.toml',
            'emotify.neoforge.client.mixins.json',
            'META-INF/jarjar/metadata.json',
            embeddedLicenseName.toString(),
            'META-INF/licenses/emotify/Happy-Better-Emojis-LICENSE.txt',
            'META-INF/licenses/emotify/Happy-Better-Emojis-NOTICE.txt',
            'assets/emotify/emotions.json',
            'assets/emotify/icon.png',
            'assets/emotify/lang/en_us.json',
            'assets/emotify/lang/ru_ru.json',
            'assets/emotify/textures/emotions/animals.png',
            'assets/emotify/textures/emotions/faces.png',
            'me/whish/emotify/Emotify.class',
            'me/whish/emotify/client/EmotifyClient.class',
            'me/whish/emotify/client/EmotionBillboardDeferredBuffer.class',
            'me/whish/emotify/client/EmotionBillboardRenderer.class',
            'me/whish/emotify/client/NeoForgeClientPayloadRegistration.class',
            'me/whish/emotify/client/EmotifySettingsScreen.class',
            'me/whish/emotify/neoforge/mixin/client/EditBoxHintMixin12111.class',
            'me/whish/emotify/neoforge/mixin/client/LevelRendererMixin.class',
            'me/whish/emotify/network/payload/CustomEmojiAssetChunkPayload.class',
            'me/whish/emotify/server/EmotifyServerConfig.class'
        ]

        new ZipFile(archiveFile).withCloseable { archive ->
            def entryNames = archive.entries().collect { entry -> entry.name }
            def missingEntries = requiredEntries.findAll { entry -> entry !in entryNames }
            if (!missingEntries.isEmpty()) {
                throw new GradleException("Release JAR is missing required entries: ${missingEntries.join(', ')}")
            }

            def duplicateEntries = entryNames.groupBy { entry -> entry }
                .findAll { entry, occurrences -> occurrences.size() > 1 }
                .keySet()
            if (!duplicateEntries.isEmpty()) {
                throw new GradleException("Release JAR contains duplicate entries: ${duplicateEntries.join(', ')}")
            }

            def nestedJarEntries = entryNames.findAll { entry ->
                entry.startsWith('META-INF/jarjar/') && entry.endsWith('.jar')
            }
            def expectedNestedJarEntries = nestedLibrarySpecifications.collect { specification -> specification.path }
            if (nestedJarEntries.toSet() != expectedNestedJarEntries.toSet()) {
                throw new GradleException(
                    "Release JAR must contain exactly the expected libraries: ${expectedNestedJarEntries.join(', ')}"
                )
            }

            def jarJarMetadataEntry = archive.getEntry('META-INF/jarjar/metadata.json')
            def jarJarMetadata = archive.getInputStream(jarJarMetadataEntry).withCloseable { stream ->
                new JsonSlurper().parse(stream)
            }
            def metadataJars = jarJarMetadata.jars instanceof Collection ? jarJarMetadata.jars : []
            def metadataNestedJarEntries = metadataJars.collect { nestedJar -> nestedJar.path }.toSet()
            def metadataByPath = metadataJars.collectEntries { nestedJar -> [(nestedJar.path): nestedJar] }
            def metadataViolations = nestedLibrarySpecifications.collectMany { specification ->
                def nestedJar = metadataByPath[specification.path]
                if (nestedJar == null) {
                    return ["${specification.path}:missing".toString()]
                }
                [
                    nestedJar.identifier?.group == specification.group ? null :
                        "${specification.path}:group=${nestedJar.identifier?.group}".toString(),
                    nestedJar.identifier?.artifact == specification.artifact ? null :
                        "${specification.path}:artifact=${nestedJar.identifier?.artifact}".toString(),
                    nestedJar.version?.artifactVersion == specification.artifactVersion ? null :
                        "${specification.path}:artifactVersion=${nestedJar.version?.artifactVersion}".toString(),
                    nestedJar.version?.range == specification.range ? null :
                        "${specification.path}:range=${nestedJar.version?.range}".toString(),
                    nestedJar.isObfuscated == false ? null :
                        "${specification.path}:isObfuscated=${nestedJar.isObfuscated}".toString()
                ].findAll { violation -> violation != null }
            }
            if (metadataJars.size() != nestedLibrarySpecifications.size() ||
                metadataNestedJarEntries != expectedNestedJarEntries.toSet() ||
                !metadataViolations.isEmpty()) {
                throw new GradleException(
                    "JarJar metadata does not match embedded libraries: paths=" +
                        "${metadataNestedJarEntries.join(', ')}, violations=${metadataViolations.join(', ')}"
                )
            }

            def nestedArchives = nestedLibrarySpecifications.collectEntries { specification ->
                def nestedBytes = archive.getInputStream(archive.getEntry(specification.path)).withCloseable { stream ->
                    stream.readAllBytes()
                }
                def nestedEntryNames = []
                def nestedEntries = [:]
                new ZipInputStream(new ByteArrayInputStream(nestedBytes)).withCloseable { nestedArchive ->
                    for (def nestedEntry = nestedArchive.nextEntry; nestedEntry != null; nestedEntry = nestedArchive.nextEntry) {
                        nestedEntryNames.add(nestedEntry.name)
                        if (!nestedEntry.directory) {
                            nestedEntries[nestedEntry.name] = nestedArchive.readAllBytes()
                        }
                    }
                }
                def duplicateNestedEntries = nestedEntryNames.groupBy { entry -> entry }
                    .findAll { entry, occurrences -> occurrences.size() > 1 }
                    .keySet()
                if (!duplicateNestedEntries.isEmpty()) {
                    throw new GradleException(
                        "Embedded library ${specification.path} contains duplicate entries: " +
                            duplicateNestedEntries.join(', ')
                    )
                }
                if (!nestedEntries.containsKey(specification.requiredClass)) {
                    throw new GradleException(
                        "Embedded library ${specification.path} is missing ${specification.requiredClass}"
                    )
                }
                def missingNestedEntries = (specification.requiredEntries ?: []).findAll { requiredEntry ->
                    !nestedEntries.containsKey(requiredEntry)
                }
                if (!missingNestedEntries.isEmpty()) {
                    throw new GradleException(
                        "Embedded library ${specification.path} is missing required entries: " +
                            missingNestedEntries.join(', ')
                    )
                }
                def manifestBytes = nestedEntries['META-INF/MANIFEST.MF']
                if (manifestBytes == null) {
                    throw new GradleException("Embedded library ${specification.path} has no manifest")
                }
                def manifest = new Manifest(new ByteArrayInputStream(manifestBytes))
                def attributes = manifest.mainAttributes
                if (attributes.getValue('Automatic-Module-Name') != specification.moduleName) {
                    throw new GradleException(
                        "Embedded library ${specification.path} has an invalid Automatic-Module-Name"
                    )
                }
                if (attributes.getValue('FMLModType') != 'LIBRARY') {
                    throw new GradleException("Embedded library ${specification.path} is not a LIBRARY")
                }
                [(specification.moduleName): nestedEntries]
            }

            def forbiddenFixtureEntries = nestedArchives.collectMany { moduleName, entries ->
                entries.keySet().findAll { entry ->
                    entry.contains('FakeMonotonicTimeSource') ||
                        entry.contains('ProtocolV1MaliciousCorpus') ||
                        entry.contains('ProtocolV1MaliciousInput') ||
                        entry.contains('ProtocolV1PayloadKind') ||
                        entry.contains('testFixtures')
                }.collect { entry -> "${moduleName}:${entry}" }
            }
            if (!forbiddenFixtureEntries.isEmpty()) {
                throw new GradleException(
                    "Release JAR contains test fixtures: ${forbiddenFixtureEntries.join(', ')}"
                )
            }

            def forbiddenEmbeddedRuntimePrefixes = [
                'kotlin/',
                'it/unimi/dsi/fastutil/',
                'org/jetbrains/annotations/',
                'com/google/gson/'
            ]
            def embeddedRuntimeEntries = nestedArchives.collectMany { moduleName, entries ->
                entries.keySet().findAll { entry ->
                    forbiddenEmbeddedRuntimePrefixes.any { prefix -> entry.startsWith(prefix) }
                }
                    .collect { entry -> "${moduleName}:${entry}" }
            }
            if (!embeddedRuntimeEntries.isEmpty()) {
                throw new GradleException(
                    "Release JAR embeds runtime classes: ${embeddedRuntimeEntries.join(', ')}"
                )
            }

            def catalogManifestBytes = nestedArchives
                .get('me.whish.emotify.catalog.builtin')
                .get('assets/emotify/emotions.json')
            def outerManifestBytes = archive.getInputStream(archive.getEntry('assets/emotify/emotions.json'))
                .withCloseable { stream -> stream.readAllBytes() }
            if (!Arrays.equals(catalogManifestBytes, outerManifestBytes)) {
                throw new GradleException('Outer and embedded built-in emotion manifests differ')
            }
            def expectedEmotionAssets = [
                'assets/emotify/emotions.json',
                'assets/emotify/textures/emotions/animals.png',
                'assets/emotify/textures/emotions/faces.png'
            ] as Set
            def actualEmotionAssets = entryNames.findAll { entry ->
                !entry.endsWith('/') &&
                    (entry == 'assets/emotify/emotions.json' || entry.startsWith('assets/emotify/textures/emotions/'))
            }.toSet()
            if (actualEmotionAssets != expectedEmotionAssets) {
                throw new GradleException(
                    "Release JAR emotion assets differ from the exact expected set: ${actualEmotionAssets.join(', ')}"
                )
            }
            def catalogAssetEntries = nestedArchives
                .get('me.whish.emotify.catalog.builtin')
                .keySet()
                .findAll { entry -> !entry.endsWith('/') && entry.startsWith('assets/emotify/') }
                .toSet()
            if (catalogAssetEntries != ['assets/emotify/emotions.json'] as Set) {
                throw new GradleException(
                    "Catalog library contains unexpected Emotify assets: ${catalogAssetEntries.join(', ')}"
                )
            }
            def expectedClientAssets = [
                'assets/emotify/icon.png',
                'assets/emotify/lang/en_us.json',
                'assets/emotify/lang/ru_ru.json',
                'assets/emotify/textures/emotions/animals.png',
                'assets/emotify/textures/emotions/faces.png'
            ] as Set
            def clientEntries = nestedArchives.get('me.whish.emotify.minecraft.client.v1_21_11')
            def clientAssetEntries = clientEntries.keySet().findAll { entry ->
                !entry.endsWith('/') && entry.startsWith('assets/')
            }.toSet()
            if (clientAssetEntries != expectedClientAssets) {
                throw new GradleException(
                    "Client library assets differ from the exact expected set: ${clientAssetEntries.join(', ')}"
                )
            }
            expectedClientAssets.each { assetPath ->
                def outerBytes = archive.getInputStream(archive.getEntry(assetPath)).withCloseable { stream ->
                    stream.readAllBytes()
                }
                if (!Arrays.equals(clientEntries.get(assetPath), outerBytes)) {
                    throw new GradleException("Outer and embedded client assets differ: ${assetPath}")
                }
            }

            def pureModuleBoundaryViolations = nestedArchives.collectMany { moduleName, entries ->
                def allowedReferences = nestedLibrarySpecifications.find { specification ->
                    specification.moduleName == moduleName
                }?.allowedReferences ?: []
                entries.findAll { entry, bytes -> entry.endsWith('.class') }
                    .collectMany { entry, bytes ->
                        def constantPool = new String(bytes, StandardCharsets.ISO_8859_1)
                        forbiddenPureModuleReferences.findAll { reference ->
                            reference !in allowedReferences && constantPool.contains(reference)
                        }
                            .collect { reference -> "${moduleName}:${entry}->${reference}" }
                    }
            }
            if (!pureModuleBoundaryViolations.isEmpty()) {
                throw new GradleException(
                    "Platform-neutral libraries reference forbidden APIs: ${pureModuleBoundaryViolations.join(', ')}"
                )
            }

            def classEntriesByArchive = ['emotify-neoforge': entryNames.findAll { entry -> entry.endsWith('.class') }]
            nestedArchives.each { moduleName, entries ->
                classEntriesByArchive[moduleName] = entries.keySet().findAll { entry -> entry.endsWith('.class') }
            }
            def archiveNames = classEntriesByArchive.keySet().toList()
            def duplicateClassPaths = []
            def splitPackages = []
            archiveNames.eachWithIndex { leftArchive, index ->
                archiveNames.drop(index + 1).each { rightArchive ->
                    def leftClasses = classEntriesByArchive[leftArchive].toSet()
                    def rightClasses = classEntriesByArchive[rightArchive].toSet()
                    leftClasses.intersect(rightClasses).each { classPath ->
                        duplicateClassPaths.add("${leftArchive}<->${rightArchive}:${classPath}")
                    }
                    def leftPackages = leftClasses.collect { classPath ->
                        def separator = classPath.lastIndexOf('/')
                        separator < 0 ? '' : classPath.substring(0, separator)
                    }.toSet()
                    def rightPackages = rightClasses.collect { classPath ->
                        def separator = classPath.lastIndexOf('/')
                        separator < 0 ? '' : classPath.substring(0, separator)
                    }.toSet()
                    leftPackages.intersect(rightPackages).each { packagePath ->
                        splitPackages.add("${leftArchive}<->${rightArchive}:${packagePath}")
                    }
                }
            }
            if (!duplicateClassPaths.isEmpty()) {
                throw new GradleException(
                    "Release JAR contains duplicate class paths: ${duplicateClassPaths.join(', ')}"
                )
            }
            if (!splitPackages.isEmpty()) {
                throw new GradleException("Release JAR contains split packages: ${splitPackages.join(', ')}")
            }

            def forbiddenEntries = entryNames.findAll { entry ->
                entry.startsWith("${clientClassPrefix}ClientSelectionDebug") ||
                    entry.startsWith('docs/') ||
                    entry.startsWith('run-client/') ||
                    entry.startsWith('run-server/') ||
                    entry.contains('/test/') ||
                    entry.endsWith('.bbmodel') ||
                    entry.contains('/.cache/')
            }
            if (!forbiddenEntries.isEmpty()) {
                throw new GradleException("Release JAR contains forbidden entries: ${forbiddenEntries.join(', ')}")
            }

            def dedicatedServerBoundaryViolations = entryNames.findAll { entry ->
                entry.startsWith(projectClassPrefix) &&
                    entry.endsWith('.class') &&
                    !entry.startsWith(clientClassPrefix) &&
                    !entry.startsWith(clientMixinClassPrefix)
            }.findAll { entry ->
                def classBytes = archive.getInputStream(archive.getEntry(entry)).withCloseable { stream ->
                    stream.readAllBytes()
                }
                def constantPool = new String(classBytes, StandardCharsets.ISO_8859_1)
                constantPool.contains('net/minecraft/client/') ||
                    constantPool.contains('net.minecraft.client.') ||
                    constantPool.contains(clientClassPrefix) ||
                    constantPool.contains(clientMixinClassPrefix) ||
                    constantPool.contains('me.whish.emotify.client.')
            }
            if (!dedicatedServerBoundaryViolations.isEmpty()) {
                throw new GradleException(
                    "Dedicated-server classes reference client-only code: ${dedicatedServerBoundaryViolations.join(', ')}"
                )
            }

            def metadataEntry = archive.getEntry('META-INF/neoforge.mods.toml')
            def metadata = archive.getInputStream(metadataEntry).withCloseable { stream ->
                stream.getText('UTF-8')
            }
            def missingMetadata = requiredReleaseMetadata.findAll { value -> !metadata.contains(value) }
            if (!missingMetadata.isEmpty()) {
                throw new GradleException("Release metadata is incomplete: ${missingMetadata.join(', ')}")
            }

            def mixinEntry = archive.getEntry('emotify.neoforge.client.mixins.json')
            def mixinMetadata = archive.getInputStream(mixinEntry).withCloseable { stream ->
                new JsonSlurper().parse(stream, 'UTF-8')
            }
            if (
                mixinMetadata.required != true ||
                mixinMetadata.package != 'me.whish.emotify.neoforge.mixin.client' ||
                mixinMetadata.compatibilityLevel != 'JAVA_21' ||
                mixinMetadata.client != ['EditBoxHintMixin12111', 'LevelRendererMixin'] ||
                mixinMetadata.injectors != [defaultRequire: 1]
            ) {
                throw new GradleException("Unexpected NeoForge client mixin contract: ${mixinMetadata}")
            }
        }
    }
}

tasks.named('check') {
    dependsOn ':emotify-core:check'
    dependsOn ':emotify-wire-v1:check'
    dependsOn ':emotify-server-core:check'
    dependsOn ':emotify-catalog-builtin:check'
    dependsOn ':minecraft-client-1.21.11:check'
    dependsOn verifyDevRuntimeClasspath
    dependsOn verifyReleaseJar
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
