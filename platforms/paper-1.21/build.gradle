def downloadPaper262Server = tasks.register('downloadPaper262Server') {
    group = 'development'
    description = 'Downloads and verifies the pinned Paper 26.2 development server.'
    inputs.property('downloadUrl', paper262DownloadUrl)
    inputs.property('sha256', paper262Sha256)
    outputs.file(paper262ServerJar)
    outputs.upToDateWhen {
        def target = paper262ServerJar.asFile
        target.isFile() && sha256(target) == paper262Sha256
    }

    doLast {
        def target = paper262ServerJar.asFile.toPath()
        def temporary = target.resolveSibling("${paper262JarName}.part")
        Files.createDirectories(target.parent)
        Files.deleteIfExists(temporary)
        try {
            def connection = new URI(paper262DownloadUrl).toURL().openConnection()
            connection.setRequestProperty(
                'User-Agent',
                'Emotify development launcher (https://github.com/TheWhish/Emotify)',
            )
            connection.connectTimeout = 15_000
            connection.readTimeout = 60_000
            connection.inputStream.withCloseable { input ->
                Files.copy(input, temporary, StandardCopyOption.REPLACE_EXISTING)
            }
            def actualSha256 = sha256(temporary.toFile())
            if (actualSha256 != paper262Sha256) {
                throw new GradleException(
                    "Paper 26.2 checksum differs: expected ${paper262Sha256}, got ${actualSha256}",
                )
            }
            Files.move(temporary, target, StandardCopyOption.REPLACE_EXISTING)
        } finally {
            Files.deleteIfExists(temporary)
        }
    }
}

