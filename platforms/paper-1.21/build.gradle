def sha256 = { File file ->
    def digest = MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        def buffer = new byte[64 * 1024]
        int bytesRead
        while ((bytesRead = input.read(buffer)) >= 0) {
            if (bytesRead > 0) {
                digest.update(buffer, 0, bytesRead)
            }
        }
    }
    digest.digest().encodeHex().toString()
}

def downloadPaper1218Server = tasks.register('downloadPaper1218Server') {
    group = 'development'
    description = 'Downloads and verifies the pinned Paper 1.21.8 development server.'
    inputs.property('downloadUrl', paper1218DownloadUrl)
    inputs.property('sha256', paper1218Sha256)
    outputs.file(paper1218ServerJar)
    outputs.upToDateWhen {
        def target = paper1218ServerJar.asFile
        target.isFile() && sha256(target) == paper1218Sha256
    }

    doLast {
        def target = paper1218ServerJar.asFile.toPath()
        def temporary = target.resolveSibling("${paper1218JarName}.part")
        Files.createDirectories(target.parent)
        Files.deleteIfExists(temporary)
        try {
            def connection = new URI(paper1218DownloadUrl).toURL().openConnection()
            connection.setRequestProperty(
                'User-Agent',
                'Emotify development launcher (https://github.com/TheWhish/Emotify)',
            )
            connection.connectTimeout = 15_000
            connection.readTimeout = 60_000
            connection.inputStream.withCloseable { input ->
                Files.copy(input, temporary, StandardCopyOption.REPLACE_EXISTING)
            }
            def actualSha256 = sha256(temporary.toFile())
            if (actualSha256 != paper1218Sha256) {
                throw new GradleException(
                    "Paper 1.21.8 checksum differs: expected ${paper1218Sha256}, got ${actualSha256}",
                )
            }
            Files.move(temporary, target, StandardCopyOption.REPLACE_EXISTING)
        } finally {
            Files.deleteIfExists(temporary)
        }
    }
}

def preparePaper1218Eula = tasks.register('preparePaper1218Eula') {
    group = 'development'
    description = 'Carries the existing local Paper test EULA acceptance into the isolated 1.21.8 runtime.'
    def acceptedEula = layout.projectDirectory.file('run-paper-smoke/eula.txt')
    def targetEula = paper1218ServerDirectory.file('eula.txt')
    inputs.file(acceptedEula).optional()
    outputs.file(targetEula)
    outputs.upToDateWhen {
        targetEula.asFile.isFile() && targetEula.asFile.text.trim() == 'eula=true'
    }

    doLast {
        if (acceptedEula.asFile.isFile() && acceptedEula.asFile.text.trim() == 'eula=true') {
            Files.createDirectories(targetEula.asFile.toPath().parent)
            Files.writeString(targetEula.asFile.toPath(), 'eula=true\n')
        }
    }
}

