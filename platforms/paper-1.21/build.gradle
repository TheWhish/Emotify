def registerSmokeServerRun = { String taskName, String serverDirectoryName, String serverJarName, deployment ->
    tasks.register(taskName, Exec) {
        group = 'application'
        description = "Deploys Emotify and starts ${serverDirectoryName}."
        dependsOn deployment
        workingDir layout.projectDirectory.dir(serverDirectoryName)
        executable serverJavaLauncher.get().executablePath.asFile.absolutePath
        args '-jar', serverJarName, 'nogui'
    }
}

