import groovy.json.JsonSlurper
import java.util.zip.ZipFile
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
    id 'org.jetbrains.kotlin.jvm'
}

version = providers.gradleProperty('mod_version').get()
group = providers.gradleProperty('mod_group_id').get()

evaluationDependsOn(':emotify-core')
evaluationDependsOn(':emotify-wire-v1')
evaluationDependsOn(':emotify-server-core')
evaluationDependsOn(':emotify-catalog-builtin')
evaluationDependsOn(':minecraft-client-26.2')

base {
    archivesName = 'emotify-neoforge-26.2'
}

repositories {
    maven {
        name = 'KotlinForForge'
        url = uri('https://thedarkcolour.github.io/KotlinForForge/')
        content {
            includeGroup 'thedarkcolour'
        }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

kotlin {
    jvmToolchain(25)

    compilerOptions {
        jvmTarget.set(JvmTarget.JVM_25)
        allWarningsAsErrors.set(true)
        progressiveMode.set(true)
    }
}

neoForge {
    version = providers.gradleProperty('neo_version_26_2').get()

    mods {
        emotify {
            sourceSet sourceSets.main
            sourceSet project(':emotify-core').sourceSets.main
            sourceSet project(':emotify-wire-v1').sourceSets.main
            sourceSet project(':emotify-server-core').sourceSets.main
            sourceSet project(':emotify-catalog-builtin').sourceSets.main
            sourceSet project(':minecraft-client-26.2').sourceSets.main
        }
    }

    runs {
        client {
            client()
            gameDirectory = rootProject.layout.projectDirectory.dir('run-neoforge-client-26.2')
        }
        server {
            server()
            gameDirectory = rootProject.layout.projectDirectory.dir('run-neoforge-server-26.2')
            programArgument '--nogui'
        }
        configureEach {
            disableIdeRun()
            logLevel = org.slf4j.event.Level.INFO
            loadedMods = [mods.named('emotify').get()]
        }
    }
}

dependencies {
    implementation "thedarkcolour:kotlinforforge-neoforge:${kotlin_for_forge_version_26_2}"
    compileOnly project(':emotify-core')
    compileOnly project(':emotify-wire-v1')
    compileOnly project(':emotify-server-core')
    compileOnly project(':emotify-catalog-builtin')
    compileOnly project(':minecraft-client-26.2')

    jarJar(project(':emotify-core')) {
        transitive = false
    }
    jarJar(project(':emotify-wire-v1')) {
        transitive = false
    }
    jarJar(project(':emotify-server-core')) {
        transitive = false
    }
    jarJar(project(':emotify-catalog-builtin')) {
        transitive = false
    }
    jarJar(project(':minecraft-client-26.2')) {
        transitive = false
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'
}

sourceSets.main.kotlin.srcDir project(':minecraft-client-26.2')
    .layout.projectDirectory.dir('src/minecraft/kotlin')

def neoForgeModProperties = [
    minecraft_version_range: providers.gradleProperty('minecraft_version_range_26_2').get(),
    neo_version_range: providers.gradleProperty('neo_version_range_26_2').get(),
    loader_version_range: providers.gradleProperty('kotlin_for_forge_version_range_26_2').get(),
    mod_id: providers.gradleProperty('mod_id').get(),
    mod_name: providers.gradleProperty('mod_name').get(),
    mod_license: providers.gradleProperty('mod_license').get(),
    mod_version: project.version,
    mod_authors: providers.gradleProperty('mod_authors').get(),
    mod_description: providers.gradleProperty('mod_description').get(),
]

def generateNeoForgeModMetadata = tasks.register('generateNeoForgeModMetadata', ProcessResources) {
    inputs.properties(neoForgeModProperties)
    expand(neoForgeModProperties)
    from('src/main/templates')
    rename('neoforge[.]mods[.]toml[.]template', 'neoforge.mods.toml')
    into(layout.buildDirectory.dir('generated/resources'))
}

sourceSets.main.resources {
    srcDir generateNeoForgeModMetadata
    srcDir project(':emotify-catalog-builtin').layout.projectDirectory.dir('src/main/resources')
    srcDir project(':minecraft-client-1.21.1').layout.projectDirectory.dir('src/main/resources')
    exclude '**/*.bbmodel', '**/.cache/**'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs.add '-Werror'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.withType(Jar).configureEach {
    includeEmptyDirs = false
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('jar', Jar) {
    from(rootProject.layout.projectDirectory.file('LICENSE')) {
        rename { 'LICENSE_emotify' }
    }
}

def neoForgeReleaseJar = tasks.named('jar', Jar).flatMap { task -> task.archiveFile }
def neoForgeReleaseVersion = project.version.toString()

def verifyNeoForge262ReleaseJar = tasks.register('verifyNeoForge262ReleaseJar') {
    group = 'verification'
    dependsOn tasks.named('jar')
    inputs.file(neoForgeReleaseJar)

    doLast {
        ZipFile archive = new ZipFile(neoForgeReleaseJar.get().asFile)
        archive.withCloseable {
            def requiredEntries = [
                'META-INF/neoforge.mods.toml',
                'META-INF/jarjar/metadata.json',
                'emotify.neoforge.client.mixins.json',
                'assets/emotify/emotions.json',
                'assets/emotify/icon.png',
                'me/whish/emotify/Emotify.class',
                'me/whish/emotify/client/EmotionBillboardDeferredBuffer.class',
                'me/whish/emotify/client/EmotionBillboardRenderer.class',
                'me/whish/emotify/client/EmotionBillboardRenderTypes.class',
            ]
            def missingEntries = requiredEntries.findAll { entry -> archive.getEntry(entry) == null }
            if (!missingEntries.isEmpty()) {
                throw new GradleException("NeoForge 26.2 release JAR is missing: ${missingEntries.join(', ')}")
            }
            def metadata = archive.getInputStream(archive.getEntry('META-INF/neoforge.mods.toml')).text
            if (!metadata.contains("version = \"${neoForgeReleaseVersion}\"") || !metadata.contains('versionRange = "[26.2]"')) {
                throw new GradleException('NeoForge 26.2 release metadata does not match the target version.')
            }
            def nestedMetadata = new JsonSlurper().parse(
                archive.getInputStream(archive.getEntry('META-INF/jarjar/metadata.json')),
            )
            if (nestedMetadata.jars?.size() != 5) {
                throw new GradleException('NeoForge 26.2 release JAR must contain exactly five embedded project libraries.')
            }
        }
    }
}

tasks.named('check') {
    dependsOn verifyNeoForge262ReleaseJar
}
