pluginManagement {
    plugins {
        id 'net.neoforged.moddev' version providers.gradleProperty('moddev_version').get()
        id 'net.fabricmc.fabric-loom' version providers.gradleProperty('fabric_loom_version').get()
        id 'net.fabricmc.fabric-loom-remap' version providers.gradleProperty('fabric_loom_version').get()
        id 'org.jetbrains.kotlin.jvm' version providers.gradleProperty('kotlin_version').get()
    }

    repositories {
        gradlePluginPortal()
        maven {
            name = 'NeoForged'
            url = uri('https://maven.neoforged.net/releases')
        }
        maven {
            name = 'Fabric'
            url = uri('https://maven.fabricmc.net/')
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Emotify'

include 'emotify-core'
include 'emotify-wire-v1'
include 'emotify-server-core'
include 'emotify-catalog-builtin'
include 'minecraft-client-1.21.1'
include 'neoforge-1.21.1'
include 'fabric-1.21.1'
include 'minecraft-client-1.21.8'
include 'neoforge-1.21.8'
include 'fabric-1.21.8'
include 'minecraft-client-1.21.11'
include 'neoforge-1.21.11'
include 'fabric-1.21.11'
include 'minecraft-client-26.2'
include 'neoforge-26.2'
include 'fabric-26.2'
include 'paper-1.21'

project(':emotify-core').projectDir = file('modules/emotify-core')
project(':emotify-wire-v1').projectDir = file('modules/emotify-wire-v1')
project(':emotify-server-core').projectDir = file('modules/emotify-server-core')
project(':emotify-catalog-builtin').projectDir = file('modules/emotify-catalog-builtin')
project(':minecraft-client-1.21.1').projectDir = file('modules/minecraft-client-1.21.1')
project(':neoforge-1.21.1').projectDir = file('platforms/neoforge-1.21.1')
project(':fabric-1.21.1').projectDir = file('platforms/fabric-1.21.1')
project(':minecraft-client-1.21.8').projectDir = file('modules/minecraft-client-1.21.8')
project(':neoforge-1.21.8').projectDir = file('platforms/neoforge-1.21.8')
project(':fabric-1.21.8').projectDir = file('platforms/fabric-1.21.8')
project(':minecraft-client-1.21.11').projectDir = file('modules/minecraft-client-1.21.11')
project(':neoforge-1.21.11').projectDir = file('platforms/neoforge-1.21.11')
project(':fabric-1.21.11').projectDir = file('platforms/fabric-1.21.11')
project(':minecraft-client-26.2').projectDir = file('modules/minecraft-client-26.2')
project(':neoforge-26.2').projectDir = file('platforms/neoforge-26.2')
